# ModuBiz — CI Pipeline
#
# Implements the merge gates defined in TESTING.md §8:
# Install → Lint+Format → Typecheck → Architecture → Unit → Integration+Isolation
# → Build → E2E Smoke → Security Scan → Coverage Gates
#
# Runs on every PR to main and on pushes to main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  ##############################################################################
  # Stage 1: Install & lint
  ##############################################################################
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

  ##############################################################################
  # Stage 2: Typecheck
  ##############################################################################
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  ##############################################################################
  # Stage 3: Architecture & boundary tests
  ##############################################################################
  architecture:
    name: Architecture Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Architecture boundary tests (dependency-cruiser)
        run: pnpm test:arch

  ##############################################################################
  # Stage 4: Unit tests + coverage
  ##############################################################################
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm test -- --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/

  ##############################################################################
  # Stage 5: Integration + isolation tests (require Docker / Testcontainers)
  ##############################################################################
  integration:
    name: Integration & Isolation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: modubiz
          POSTGRES_PASSWORD: modubiz_test
          POSTGRES_DB: modubiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Docker availability
        id: check-docker
        run: |
          if docker info &>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Docker is available"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Docker NOT available — integration tests will be skipped"
          fi

      - name: Run integration tests
        if: steps.check-docker.outputs.available == 'true'
        continue-on-error: true
        run: pnpm test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://modubiz:modubiz_test@localhost:5432/modubiz_test

      - name: Skip notice
        if: steps.check-docker.outputs.available != 'true'
        run: echo "::warning::Integration tests skipped — Docker is not available on this runner. Configure a self-hosted Docker runner or use GitHub-hosted larger runners to enable integration testing."
  ##############################################################################
  # Stage 6: Build
  ##############################################################################
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

  ##############################################################################
  # Stage 7: Security scan
  ##############################################################################
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # gitleaks-action scans the pushed commit range (firstCommit^..head) on
      # push events. A shallow checkout (default fetch-depth: 1) lacks the
      # parent commit, so git errors out and gitleaks exits 1 — a false
      # failure, not a real leak. Full history fixes it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: pnpm audit
        run: pnpm audit --audit-level=critical

  ##############################################################################
  # Stage 8: E2E smoke tests (on PR, full suite nightly)
  ##############################################################################
  e2e:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build web app
        run: pnpm --filter web build

      - name: Run E2E smoke tests
        run: pnpm test:e2e
        env:
          NODE_ENV: test
