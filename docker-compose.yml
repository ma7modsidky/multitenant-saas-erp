services:
  postgres:
    image: postgres:16-alpine
    container_name: modubiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: modubiz_owner
      POSTGRES_PASSWORD: modubiz_owner_password
      POSTGRES_DB: modubiz
    ports:
      - '5432:5432'
    volumes:
      - modubiz-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U modubiz_owner -d modubiz']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: modubiz-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - modubiz-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  modubiz-postgres-data:
  modubiz-redis-data:
